[package]
name = "topstitch"
version = "0.100.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Stitch together Verilog modules with Rust"
repository = "https://github.com/zarubaf/sandstitch"
homepage = "https://github.com/zarubaf/sandstitch"

[workspace]
members = ["crates/*", "xtask"]

[dependencies]
num-bigint = "0.4.3"
indexmap = "2.5.0"
xlsynth-vast = { path = "crates/xlsynth-vast", version = "=0.65.0" }
slang-rs = { path = "crates/slang-rs", version = "=0.22.0" }
itertools = "0.10"
regex = "1.11.0"
nalgebra = { version = "0.32", default-features = false, features = ["macros"] }
fixedbitset = "0.5.7"
paste = "1.0.15"
geo = "0.31.0"
rstar = "0.12.2"
parking_lot = "0.12"
annotate-snippets = "=0.12.16"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.8"
tempfile = "3"

[dev-dependencies]
cargo_metadata = "0.18"
log = "0.4"
env_logger = "0.11"
rstest = "0.26.1"
