# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ hashFiles('flake.lock', 'crates/slang-sys/vendor/**', 'crates/slang-sys/build.rs', 'crates/slang-sys/build/**') }}
          restore-keys: ccache-

      - name: Run checks
        run: nix develop --command cargo xtask ci
